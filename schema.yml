          type: integer
          readOnly: true
        property:
          type: integer
          readOnly: true
        room:
          type: integer
        room_details:
          allOf:
          - $ref: '#/components/schemas/Room'
          readOnly: true
        guest_name:
          type: string
          maxLength: 255
        guest_email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        guest_phone:
          type: string
          maxLength: 50
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        total_nights:
          type: integer
          readOnly: true
        nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - check_in_date
      - check_out_date
      - created_at
      - guest_name
      - guest_phone
      - id
      - nightly_rate
      - payment_status
      - property
      - room
      - room_details
      - status
      - tenant
      - total_amount
      - total_nights
      - updated_at
