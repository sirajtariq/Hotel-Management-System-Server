components:
  schemas:
    AccountHead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        expenses_count:
          type: integer
          readOnly: true
          default: 0
        total_spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          default: '0.00'
      required:
      - created_at
      - expenses_count
      - id
      - name
      - tenant
      - total_spent_amount
    AccountHeadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        is_active:
          type: boolean
      required:
      - name
    AccountTransfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_account:
          type: integer
        from_account_name:
          type: string
          readOnly: true
        to_account:
          type: integer
        to_account_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        transfer_date:
          type: string
          format: date
        reference_number:
          type: string
          maxLength: 80
        notes:
          type: string
        receipt_image:
          type: string
          format: uri
          nullable: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - created_by_name
      - from_account
      - from_account_name
      - id
      - to_account
      - to_account_name
    AccountTransferRequest:
      type: object
      properties:
        from_account:
          type: integer
        to_account:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        transfer_date:
          type: string
          format: date
        reference_number:
          type: string
          maxLength: 80
        notes:
          type: string
        receipt_image:
          type: string
          format: binary
          nullable: true
      required:
      - amount
      - from_account
      - to_account
    AccountTypeEnum:
      enum:
      - CASH
      - BANK
      - ONLINE
      - OTHER
      type: string
      description: |-
        * `CASH` - Cash Drawer
        * `BANK` - Bank Account
        * `ONLINE` - Online Gateway
        * `OTHER` - Other
    ArrivalItem:
      type: object
      properties:
        id:
          type: integer
        guest_name:
          type: string
        guest_phone:
          type: string
        room_id:
          type: integer
          nullable: true
        room_number:
          type: string
        room_type_name:
          type: string
        check_in_date:
          type: string
        advance_paid:
          type: number
          format: double
        total_amount:
          type: number
          format: double
        status:
          type: string
      required:
      - advance_paid
      - check_in_date
      - guest_name
      - guest_phone
      - id
      - room_id
      - room_number
      - room_type_name
      - status
      - total_amount
    BillingTypeEnum:
      enum:
      - MONTHLY
      - ONE_TIME
      - ANNUAL
      type: string
      description: |-
        * `MONTHLY` - Monthly Subscription
        * `ONE_TIME` - One-Time License
        * `ANNUAL` - Annual Subscription
    BookingDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        property:
          type: integer
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_address:
          type: string
          readOnly: true
          default: ''
        property_city:
          type: string
          readOnly: true
          default: ''
        property_phone:
          type: string
          readOnly: true
          default: ''
        property_email:
          type: string
          readOnly: true
          default: ''
        property_data:
          type: string
          readOnly: true
        room:
          type: integer
        room_number:
          type: string
          readOnly: true
        room_type_name:
          type: string
          readOnly: true
        booking_type:
